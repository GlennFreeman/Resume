design:
  theme: sb2nov

  page:
    size: us-letter
    top_margin: 0.2in
    bottom_margin: 0.2in
    left_margin: 0.4in
    right_margin: 0.4in
    show_footer: False
    show_top_note: False

  colors:
    body: rgb(0, 0, 0)
    name: rgb(111, 84, 156)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(111, 84, 156)
    links: rgb(0, 79, 144)

  links:
    underline: true
    show_external_link_icon: false

  header:
    alignment: center
    space_below_name: 0.2cm
    space_below_headline: 0.3cm
    space_below_connections: 0.3cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.4cm

  section_titles:
    type: with_partial_line
    line_thickness: 1.5pt
    space_above: 0.25cm
    space_below: 0.2cm

